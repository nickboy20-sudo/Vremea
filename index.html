// ─── Favorites ───
const FAV_KEY='meteoro_favs_v3';
function getFavs(){try{return JSON.parse(localStorage.getItem(FAV_KEY)||'[]');}catch{return[];}}
function saveFavs(f){localStorage.setItem(FAV_KEY,JSON.stringify(f));}
function isFav(){return getFavs().some(x=>Math.abs(x.lat-state.lat)<0.05&&Math.abs(x.lon-state.lon)<0.05);}
function toggleFav(){
  const favs=getFavs();
  const idx=favs.findIndex(x=>Math.abs(x.lat-state.lat)<0.05&&Math.abs(x.lon-state.lon)<0.05);
  if(idx>=0)favs.splice(idx,1);else favs.unshift({city:state.city,country:state.country,lat:state.lat,lon:state.lon,tz:state.tz});
  saveFavs(favs.slice(0,8));
  renderFavs();
  const btn=document.querySelector('.fav-star');
  if(btn){const s=isFav();btn.textContent=s?'★':'☆';btn.classList.toggle('saved',s);}
  showToast(idx>=0?'Eliminat din favorite':'✓ Adăugat la favorite');
}
function renderFavs(){
  const row=document.getElementById('favoritesRow');if(!row)return;
  const favs=getFavs();
  if(!favs.length){row.innerHTML='<span style="font-size:11px;color:var(--text3)">Apasă ★ pentru a salva locații</span>';return;}
  row.innerHTML=favs.map(f=>{
    const active=Math.abs(f.lat-state.lat)<0.05&&Math.abs(f.lon-state.lon)<0.05;
    return`<button class="fav-chip${active?' active':''}" onclick="goFav(${f.lat},${f.lon},'${f.city.replace(/'/g,"\\'")}','${(f.country||'').replace(/'/g,"\\'")}','${f.tz}')">${esc(f.city)}<span class="rm" onclick="event.stopPropagation();removeFav(${f.lat},${f.lon})">×</span></button>`;
  }).join('');
}
function goFav(lat,lon,city,country,tz){setState({lat,lon,city,country,tz});searchInput.value=city+(country?`, ${country}`:'');searchClear.style.display='flex';loadWeather();}
function removeFav(lat,lon){saveFavs(getFavs().filter(x=>Math.abs(x.lat-lat)>=0.05||Math.abs(x.lon-lon)>=0.05));renderFavs();}

// ─── Clock ───
function startClock(){
  clearInterval(clockInterval);
  function update(){
    try{
      const now=new Date();
      const t=now.toLocaleTimeString('ro-RO',{timeZone:state.tz,hour:'2-digit',minute:'2-digit',second:'2-digit'});
      const el=document.getElementById('liveClock');if(el)el.textContent=t;
      const el2=document.getElementById('liveClock2');if(el2)el2.textContent=t;
    }catch(e){}
  }
  update();
  clockInterval=setInterval(update,1000);
}

// ─── Day/Hour Selection ───
function selectDay(i){
  setState({selectedDay:i,selectedHour:null});
  if(!state.data)return;
  document.querySelectorAll('.day-card').forEach((el,idx)=>el.classList.toggle('active',idx===i));
  const d=state.data.daily;
  const rEl=document.querySelector('.sun-rise-time');if(rEl)rEl.textContent=formatTime(d.sunrise[i]);
  const sEl=document.querySelector('.sun-set-time');if(sEl)sEl.textContent=formatTime(d.sunset[i]);
  const durEl=document.querySelector('.sun-duration');if(durEl)durEl.textContent=daylight(d.sunrise[i],d.sunset[i]);
  const arcEl=document.querySelector('.sun-arc-wrap');if(arcEl)arcEl.innerHTML=drawSunArc(d.sunrise[i],d.sunset[i]);
  const hours=i===0?getHourlyFromNow(state.data):getHourlyForDay(state.data,i);
  const hs=document.querySelector('.hourly-scroll');if(hs)hs.innerHTML=buildHourlyRow(hours);
  const ht=document.querySelector('.hourly-chart-title');if(ht)ht.textContent=`Orar — ${i===0?'Azi':shortDate(state.data.daily.time[i])}`;
  drawCharts(state.data,hours,state.data.current);
}

function selectHour(t){
  state.selectedHour=t;
  const hours=state.selectedDay===0?getHourlyFromNow(state.data):getHourlyForDay(state.data,state.selectedDay);
  const hs=document.querySelector('.hourly-scroll');if(hs)hs.innerHTML=buildHourlyRow(hours);
}

function dismissAlert(btn){btn.closest('.alert-item').remove();}

// ─── HTML Builders ───
function buildHourlyRow(hours){
  return hours.map(h=>{
    const sel=state.selectedHour===h.t?' active':'';
    const sep=h.newDay?`<div class="hour-day-sep">›</div>`:'';
    return sep+`<div class="hour-card${h.isNow?' active now':''}${sel}" onclick="selectHour('${h.t}')">
      <div class="hour-time">${h.isNow?'Acum':h.hour}</div>
      <div class="hour-icon">${iconForTime(h.code,h.isDay!==false)}</div>
      <div class="hour-temp">${ft(h.temp)}${ftLabel()}</div>
      ${h.feel!==undefined&&h.feel!==h.temp?`<div class="hour-feel">res.${ft(h.feel)}°</div>`:''}
      ${h.prec>0?`<div class="hour-prec">${h.prec}mm</div>`:`<div class="hour-prec">${h.precProb>30?h.precProb+'%':''}</div>`}
    </div>`;
  }).join('');
}

function buildDayCards(data){
  return data.daily.time.map((day,i)=>{
    const d=data.daily;
    const label=i===0?'Azi':i===1?'Mâine':shortDay(day);
    const prec=+(d.precipitation_sum[i]||0).toFixed(1);
    const precProb=d.precipitation_probability_max?.[i];
    return`<div class="day-card${i===state.selectedDay?' active':''}" onclick="selectDay(${i})">
      <div class="day-label-col"><span class="day-name">${label}</span><span class="day-date">${shortDate(day)}</span></div>
      <div class="day-icon">${icon(d.weathercode[i])}</div>
      <div>
        <div class="day-desc">${desc(d.weathercode[i])}</div>
        <div class="day-prec${prec>0?'':' no-rain'}">${prec>0?'· '+prec+'mm':''}${precProb?` · ${precProb}%`:''}</div>
      </div>
      <div class="day-temps"><span class="day-low">${ft(d.temperature_2m_min[i])}°</span><span class="day-high">${ft(d.temperature_2m_max[i])}°</span></div>
    </div>`;
  }).join('');
}

function buildAQICard(aqiData){
  if(!aqiData?.current)return'';
  const c=aqiData.current;
  const aqiVal=Math.round(c.european_aqi||0);
  const info=getAQIInfo(aqiVal);
  const pm25=c.pm2_5!=null?c.pm2_5.toFixed(1):'—';
  const pm10=c.pm10!=null?c.pm10.toFixed(1):'—';
  const no2=c.nitrogen_dioxide!=null?c.nitrogen_dioxide.toFixed(1):'—';
  const o3=c.ozone!=null?c.ozone.toFixed(1):'—';
  const pct=Math.min(100,aqiVal);
  return`<div class="aqi-card" style="background:${info.bg};border-color:${info.border}">
    <div class="aqi-header">
      <div class="aqi-index">
        <div class="aqi-circle" style="border-color:${info.color};box-shadow:0 0 20px ${info.color}33;color:${info.color}">
          <div class="aqi-val">${aqiVal}</div>
          <div class="aqi-lbl-sm">AQI</div>
        </div>
        <div class="aqi-info">
          <div class="aqi-title">Calitate aer · European AQI</div>
          <div class="aqi-status" style="color:${info.color}">${info.level}</div>
          <div class="aqi-desc-text">${info.desc}</div>
        </div>
      </div>
    </div>
    <div class="aqi-bar-row">
      <div class="aqi-scale">
        ${[['#4ade80','Bun'],['#86efac','Bun'],['#fbbf24','Mod.'],['#fb923c','Nsat.'],['#f87171','Rău'],['#dc2626','Peric.']].map(([c,l],i)=>`<div class="aqi-scale-seg" style="background:${c};opacity:${pct>i*20&&pct<=(i+1)*20?1:0.3}"></div>`).join('')}
      </div>
      <div class="aqi-pointer-wrap">
        <div class="aqi-pointer" style="left:${pct}%"></div>
      </div>
      <div class="aqi-scale-labels"><span>0</span><span>20</span><span>40</span><span>60</span><span>80</span><span>100+</span></div>
    </div>
    <div class="aqi-pollutants">
      <div class="aqi-poll-item"><div class="aqi-poll-name">PM2.5</div><div class="aqi-poll-val">${pm25}<span class="aqi-poll-unit">μg/m³</span></div></div>
      <div class="aqi-poll-item"><div class="aqi-poll-name">PM10</div><div class="aqi-poll-val">${pm10}<span class="aqi-poll-unit">μg/m³</span></div></div>
      <div class="aqi-poll-item"><div class="aqi-poll-name">NO₂</div><div class="aqi-poll-val">${no2}<span class="aqi-poll-unit">μg/m³</span></div></div>
      <div class="aqi-poll-item"><div class="aqi-poll-name">O₃</div><div class="aqi-poll-val">${o3}<span class="aqi-poll-unit">μg/m³</span></div></div>
    </div>
  </div>`;
}

function buildMoonCard(daily){
  const moon=getMoonPhase(new Date());
  const nextFull=getMoonPhase(new Date(Date.now()+14*24*60*60*1000));
  const illumination=Math.round(Math.abs(Math.sin(moon.phase*Math.PI*2))*100);
  return`<div class="moon-phase-card">
    <div class="moon-visual">
      <div class="moon-svg-wrap" style="font-size:48px;display:flex;align-items:center;justify-content:center">${moon.emoji}</div>
      <div class="moon-phase-name">${moon.name}</div>
    </div>
    <div class="moon-details">
      <div class="moon-detail-item"><div class="moon-detail-label">Iluminare</div><div class="moon-detail-val">${illumination}%</div></div>
      <div class="moon-detail-item"><div class="moon-detail-label">Progres ciclu</div><div class="moon-detail-val">${moon.pct}%</div></div>
      <div class="moon-detail-item"><div class="moon-detail-label">Răsărit</div><div class="moon-detail-val" style="font-size:12px;color:var(--text2)">Variabil</div></div>
      <div class="moon-detail-item"><div class="moon-detail-label">Ciclu lunar</div><div class="moon-detail-val" style="font-size:12px;color:var(--text2)">29.5 zile</div></div>
    </div>
  </div>`;
}

// ─── Main Render ───
function render(data,aqiData){
  setState({data});
  const cw=data.current;
  const d=data.daily;
  const isDay=cw.is_day??1;
  updateWeatherBg(cw.weathercode||0,isDay);

  const hours=getHourlyFromNow(data);
  const temp=cw.temperature_2m,feels=cw.apparent_temperature??temp,hum=cw.relative_humidity_2m??0;
  const pressure=cw.pressure_msl??1013,uv=cw.uv_index??0,ws=cw.windspeed_10m??0,wg=cw.windgusts_10m??0;
  const dew=cw.dew_point_2m,cloud=cw.cloud_cover;
  const vis=data.hourly.visibility?Math.round(data.hourly.visibility[0]/1000):10;
  const visLabel=vis<1?'ceață densă':vis<4?'vizibilitate redusă':vis<10?'moderată':'bună';
  const uvLabel=uv<3?'Scăzut':uv<6?'Moderat':uv<8?'Ridicat':uv<11?'Foarte ridicat':'Extrem';
  const uvColor=uv<3?'var(--teal)':uv<6?'var(--gold)':uv<8?'#f08a2e':uv<11?'#ef4444':'#dc2626';

  // Pressure trend
  let pressureTrend='stabilă',pressureTrendClass='stable';
  if(data.hourly.pressure_msl){
    const{currentHourStr}=nowLocalISO();
    const ni=data.hourly.time.findIndex(t=>t.startsWith(currentHourStr));
    if(ni>=3){
      const past=data.hourly.pressure_msl.slice(Math.max(0,ni-3),ni);
      const fut=data.hourly.pressure_msl.slice(ni,ni+3);
      const diff=(fut.reduce((a,b)=>a+b,0)/fut.length)-(past.reduce((a,b)=>a+b,0)/past.length);
      if(diff>1.5){pressureTrend='↑ în creștere';pressureTrendClass='up';}
      else if(diff<-1.5){pressureTrend='↓ în scădere';pressureTrendClass='down';}
    }
  }

  // Outfit
  let outfit='',tags=[],outfitEmoji='👕';
  if(temp<=0){outfit='Foarte frig – geacă groasă, căciulă, mănuși, termolenjerie.';tags=['termolenjerie','strat izolant','fular','cizme impermeabile'];outfitEmoji='🧥';}
  else if(temp<=8){outfit='Răcoare – geacă călduroasă, pulover gros.';tags=['geacă','pulover','long sleeve'];outfitEmoji='🧣';}
  else if(temp<=16){outfit='Răcoros plăcut – hanorac sau jachetă ușoară.';tags=['hanorac','jeans','adidași'];outfitEmoji='🧥';}
  else if(temp<=24){outfit='Temperaturi plăcute – tricou, eventual strat subțire seara.';tags=['tricou','blugi','jacket subțire'];outfitEmoji='👕';}
  else{outfit='Cald sau fierbinte – haine lejere și ușoare. Hidratează-te!';tags=['tricou în','pantaloni scurți','pălărie'];outfitEmoji='😎';}
  if([51,53,55,61,63,65,80,81,82,95,96,99].includes(cw.weathercode||0)){outfit+=' Nu uita umbrela!';tags.push('☔ umbrelă');}
  if(ws>25)tags.push('💨 windbreaker');
  if(uv>=6)tags.push('🧴 SPF 30+');
  if(hum>=75&&temp>=20)tags.push('💧 hidratare');

  // Precip total
  const sums=getRemainingPrecip(data);
  const totalPrecip=+sums.reduce((a,b)=>a+b,0).toFixed(1);
  const rainyDays=sums.filter(v=>v>=0.1).length;
  const precipPct=Math.min(100,Math.round(totalPrecip));
  const PREC=[{max:0,label:'Perioadă secetoasă — nicio precipitație prognozată',emoji:'🏜️'},{max:10,label:'Precipitații foarte reduse',emoji:'🌂'},{max:30,label:'Precipitații ușoare în această perioadă',emoji:'🌂'},{max:60,label:'Precipitații moderate — ține umbrela la îndemână',emoji:'☔'},{max:100,label:'Precipitații abundente prognozate',emoji:'☔'},{max:Infinity,label:'Precipitații foarte abundente — pregătit-te',emoji:'🌊'}];
  const threshold=PREC.find(t=>totalPrecip<=t.max);

  // Week summary
  const n=d.time.length;
  let hotIdx=0,coldIdx=0,rainIdx=0,chanceIdx=0;
  for(let i=1;i<n;i++){
    if(d.temperature_2m_max[i]>d.temperature_2m_max[hotIdx])hotIdx=i;
    if(d.temperature_2m_min[i]<d.temperature_2m_min[coldIdx])coldIdx=i;
    if((d.precipitation_sum[i]||0)>(d.precipitation_sum[rainIdx]||0))rainIdx=i;
    if((d.precipitation_probability_max?.[i]||0)>(d.precipitation_probability_max?.[chanceIdx]||0))chanceIdx=i;
  }
  const dayLbl=i=>i===0?'azi':shortDay(d.time[i]);
  const rainMax=+(d.precipitation_sum[rainIdx]||0).toFixed(1);
  const chanceMax=d.precipitation_probability_max?Math.round(d.precipitation_probability_max[chanceIdx]||0):null;
  const uvMax=d.uv_index_max?Math.round(d.uv_index_max[0]||0):null;

  const best=findBestWindow(hours);
  const favSaved=isFav();

  // Build alerts
  const alertsArr=buildAlerts(hours,cw,d,aqiData);
  const alertsHtml=alertsArr.length?`<div class="alerts-section" id="alertsSection">${alertsArr.map(a=>`
    <div class="alert-item ${a.type}">
      <div class="alert-icon">${a.icon}</div>
      <div class="alert-body"><div class="alert-title">${a.title}</div>${a.desc?`<div class="alert-desc">${a.desc}</div>`:''}</div>
      <button class="alert-close" onclick="dismissAlert(this)" title="Închide">×</button>
    </div>`).join('')}</div>`:'';

  const html=`
${alertsHtml}
<div class="header">
  <div>
    <div class="location-head">
      <div class="location-name">${esc(state.city)}</div>
      <button class="fav-star${favSaved?' saved':''}" onclick="toggleFav()" title="Salvează locația">${favSaved?'★':'☆'}</button>
    </div>
    <div class="location-sub">${esc(state.country||'—')} · <span id="liveClock" style="color:var(--text2)">--:--:--</span> · <span style="color:var(--teal);opacity:0.8">actualizat ${new Date(data._fetchedAt||Date.now()).toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'})}</span></div>
  </div>
  <div class="now-temp">
    <div class="current-icon">${iconForTime(cw.weathercode||0,isDay)}</div>
    <div class="current-temp">${ft(temp)}${ftLabel()}</div>
    <div class="current-cond">${desc(cw.weathercode||0)}</div>
  </div>
</div>

<div class="metrics-grid">
  <div class="metric-card">
    <div class="metric-label">${SVG.thermometer} Se resimte</div>
    <div class="metric-value">${ft(feels)}<span>${ftLabel()}</span></div>
    <div class="metric-sub">${feels>temp+1?'mai cald decât arată':feels<temp-1?'mai rece decât arată':'ca temperatura reală'}</div>
  </div>
  <div class="metric-card">
    <div class="metric-label">${SVG.droplets} Umiditate</div>
    <div class="metric-value">${hum}<span>%</span></div>
    <div class="metric-sub">${hum>80?'Foarte umed':hum>60?'Umed':hum<35?'Uscat':'Confortabil'}</div>
    <div class="metric-bar"><div class="metric-bar-fill" style="width:${hum}%;background:linear-gradient(90deg,var(--blue),var(--teal))"></div></div>
  </div>
  <div class="metric-card">
    <div class="metric-label">${SVG.gauge} Presiune</div>
    <div class="metric-value">${Math.round(pressure)}<span>hPa</span></div>
    <div class="metric-trend ${pressureTrendClass}">${pressureTrend}</div>
  </div>
  <div class="metric-card">
    <div class="metric-label">${SVG.sun16} UV Index</div>
    <div class="metric-value" style="color:${uvColor}">${uv.toFixed?uv.toFixed(1):uv}<span></span></div>
    <div class="metric-sub">${uvLabel}</div>
    <div class="metric-bar"><div class="metric-bar-fill" style="width:${Math.min(100,uv/11*100)}%;background:${uvColor}"></div></div>
  </div>
  <div class="metric-card">
    <div class="metric-label">${SVG.eye16} Vizibilitate</div>
    <div class="metric-value">${vis}<span>km</span></div>
    <div class="metric-sub">${visLabel}</div>
  </div>
  <div class="metric-card">
    <div class="metric-label">${SVG.wind16} Rafale vânt</div>
    <div class="metric-value">${Math.round(wg)}<span>km/h</span></div>
    <div class="metric-sub">${windDirLabel(cw.winddirection_10m||0)} · ${Math.round(ws)} km/h medie</div>
  </div>
  ${dew!=null?`<div class="metric-card">
    <div class="metric-label">${SVG.droplets} Punct de rouă</div>
    <div class="metric-value">${ft(dew)}<span>${ftLabel()}</span></div>
    <div class="metric-sub">${dew>=(state.unit==='F'?68:20)?'Disconfort umed':dew>=(state.unit==='F'?60:15)?'Umed plăcut':'Aer uscat'}</div>
  </div>`:''}
  ${cloud!=null?`<div class="metric-card">
    <div class="metric-label">${SVG.cloud16} Acoperire nori</div>
    <div class="metric-value">${Math.round(cloud)}<span>%</span></div>
    <div class="metric-sub">${cloud>80?'Cer acoperit':cloud>40?'Parțial noros':'Cer senin'}</div>
    <div class="metric-bar"><div class="metric-bar-fill" style="width:${cloud}%;background:linear-gradient(90deg,rgba(148,163,184,0.6),rgba(148,163,184,0.3))"></div></div>
  </div>`:''}
</div>

<div class="outfit-card">
  <div class="outfit-emoji">${outfitEmoji}</div>
  <div>
    <div class="outfit-title">Ce port azi?</div>
    <div class="outfit-text">${outfit}</div>
    <div class="outfit-tags">${tags.map(t=>`<span class="outfit-tag">${t}</span>`).join('')}</div>
  </div>
</div>

<div class="section-label">Prognoză orară · Următoarele 24h</div>
${best?`<div class="best-window">✦ <strong>Fereastra ideală:</strong> ${best.start}–${best.end}, ${ft(best.temp)}${ftLabel()}, precipitații ${best.prec}mm</div>`:''}
<div class="hourly-scroll" id="hourlyScroll">${buildHourlyRow(hours)}</div>

<div class="week-summary-card">
  <div class="week-summary-title">Rezumat 10 zile</div>
  <div class="week-summary-grid">
    <div><div class="week-summary-label"><span class="wsi-icon">☀️</span> Cel mai cald</div><div class="week-summary-value hot">${ft(d.temperature_2m_max[hotIdx])}${ftLabel()}</div><div class="week-summary-day">${dayLbl(hotIdx)}</div></div>
    <div><div class="week-summary-label"><span class="wsi-icon">❄️</span> Cel mai frig</div><div class="week-summary-value cold">${ft(d.temperature_2m_min[coldIdx])}${ftLabel()}</div><div class="week-summary-day">${dayLbl(coldIdx)}</div></div>
    <div><div class="week-summary-label"><span class="wsi-icon">🌧️</span> Cea mai ploioasă</div><div class="week-summary-value rain">${rainMax} mm</div><div class="week-summary-day">${dayLbl(rainIdx)}</div></div>
    ${chanceMax!==null?`<div><div class="week-summary-label"><span class="wsi-icon">💧</span> Max. șanse ploaie</div><div class="week-summary-value chance">${chanceMax}%</div><div class="week-summary-day">${dayLbl(chanceIdx)}</div></div>`:''}
    ${uvMax!==null?`<div><div class="week-summary-label"><span class="wsi-icon">🔆</span> Max UV</div><div class="week-summary-value" style="color:${uvColor}">${uvMax}</div><div class="week-summary-day">azi</div></div>`:''}
  </div>
</div>

<div class="section-label">Prognoză 10 zile</div>
<div class="days-grid" id="daysGrid">${buildDayCards(data)}</div>

<div class="precip-total-card">
  <div class="precip-total-icon">${threshold.emoji}</div>
  <div>
    <div class="precip-total-label">Precipitații rămase · 10 zile</div>
    <div class="precip-total-value">${totalPrecip}<span>mm</span></div>
    <div class="precip-total-sub">${threshold.label}</div>
  </div>
  <div>
    <div class="precip-rainy-days"><strong>${rainyDays}</strong> zi${rainyDays!==1?'le':''} ${rainyDays!==1?'ploioase':'ploioasă'}</div>
    <div class="precip-bar-wrap"><div class="precip-bar-fill" id="precipBarFill" style="width:0%"></div></div>
    <div class="precip-bar-label">${precipPct}% dintr-o perioadă ploioasă intensă (100mm)</div>
  </div>
</div>

${buildAQICard(aqiData)}

<div class="hourly-chart-card">
  <div class="chart-title hourly-chart-title">Orar — Azi (temperatură &amp; precipitații)</div>
  <div class="hourly-chart-wrap"><canvas id="hourlyChart"></canvas></div>
</div>

<div class="charts-row">
  <div class="chart-card">
    <div class="chart-title">Precipitații rămase · 10 zile (mm)</div>
    <div class="chart-wrap"><canvas id="precipChart"></canvas></div>
  </div>
  <div class="chart-card">
    <div class="chart-title">Interval temperaturi · 10 zile</div>
    <div class="chart-wrap"><canvas id="tempChart"></canvas></div>
  </div>
</div>

<div class="wind-chart-card">
  <div class="wind-chart-header">
    <div>
      <div class="chart-title" style="margin-bottom:4px">Viteza vântului · 24h</div>
      <div class="wind-chart-subtitle">Linia punctată galbenă = viteza actuală</div>
    </div>
    <div class="wind-now-badge">
      <div class="wind-compass" id="windCompass" style="transform:rotate(${cw.winddirection_10m||0}deg)">↑</div>
      <div>
        <div class="wind-now-val">${Math.round(ws)} <span>km/h</span></div>
        <div class="wind-now-dir">${windDirLabel(cw.winddirection_10m||0)}</div>
      </div>
    </div>
  </div>
  <div class="wind-chart-wrap"><canvas id="windChart"></canvas></div>
</div>

<div class="sun-section">
  <div class="sun-info" style="align-items:flex-start">
    <div class="sun-label">Răsărit</div>
    <div class="sun-time sun-rise-time">${formatTime(d.sunrise[0])}</div>
  </div>
  <div class="sun-arc-wrap">${drawSunArc(d.sunrise[0],d.sunset[0])}</div>
  <div class="sun-info" style="align-items:flex-end">
    <div class="sun-label">Apus</div>
    <div class="sun-time sun-set-time">${formatTime(d.sunset[0])}</div>
    <div class="sun-duration">${daylight(d.sunrise[0],d.sunset[0])}</div>
  </div>
</div>

${buildMoonCard(d)}

<div class="windy-section">
  <div class="section-label">Hartă radar &amp; precipitații live</div>
  <div class="windy-card">
    <div class="windy-card-header">
      <div class="windy-card-title"><div class="windy-dot"></div> Ventusky · Radar Live</div>
    </div>
    <div class="windy-frame-wrap">
      <div class="windy-loader" id="windyLoader"><div class="spinner" style="border-top-color:var(--teal)"></div><div class="windy-loader-text">Se încarcă harta radar…</div></div>
      <iframe id="ventuskyFrame" src="https://embed.ventusky.com/?p=${state.lat};${state.lon};7&l=radar" allowfullscreen onload="document.getElementById('windyLoader')?.classList.add('hidden')" style="width:100%;height:100%;border:none;display:block;border-radius:0 0 22px 22px"></iframe>
    </div>
  </div>
</div>`;

  document.getElementById('app').innerHTML=html;
  startClock();
  renderFavs();
  setTimeout(()=>{
    const fill=document.getElementById('precipBarFill');if(fill)fill.style.width=precipPct+'%';
    drawCharts(data,hours,cw);
  },80);
}

// ─── Init ───
if(PERF.fancy&&!PERF.rm){
  let raf=false,mx=0,my=0;
  window.addEventListener('mousemove',e=>{
    mx=(e.clientX/window.innerWidth)-0.5;my=(e.clientY/window.innerHeight)-0.5;
    if(raf)return;raf=true;
    requestAnimationFrame(()=>{
      const bg=document.getElementById('weather-bg');
      if(bg)bg.style.transform=`translate(${mx*-16}px,${my*-12}px) scale(1.05)`;
      raf=false;
    });
  },{passive:true});
}

loadWeather();
renderFavs();
startClock();
</script>
</body>
</html>
