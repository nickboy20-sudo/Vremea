<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeteoRo — Prognoză Meteo Avansată</title>
<meta name="description" content="Prognoză meteo detaliată cu date în timp real, alerte, grafice și hartă radar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg:#030610;--bg2:#060c1a;--bg3:#0b1225;
  --card:rgba(255,255,255,0.045);--card-hover:rgba(255,255,255,0.075);
  --border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.16);
  --border-glow:rgba(99,160,255,0.25);
  --text:#eef0ff;--text2:rgba(238,240,255,0.6);--text3:rgba(238,240,255,0.3);
  --gold:#fbbf24;--gold2:#f59e0b;--teal:#2dd4bf;--teal2:#14b8a6;
  --blue:#60a5fa;--blue2:#3b82f6;--rain:#93c5fd;--accent:#c084fc;
  --danger:#f87171;--warn:#fb923c;--success:#4ade80;
  --font-display:'Space Grotesk',sans-serif;
  --font-data:'Inter',sans-serif;--font-mono:'JetBrains Mono',monospace;
  --r:16px;--r2:22px;--r3:28px;
  --blur-sm:14px;--blur-lg:20px;
  --shadow:0 12px 40px rgba(0,0,0,0.6),0 2px 8px rgba(0,0,0,0.4);
  --shadow-sm:0 4px 16px rgba(0,0,0,0.4);
  --inner-glow:inset 0 1px 0 rgba(255,255,255,0.07),inset 0 -1px 0 rgba(0,0,0,0.2);
}

body{background:var(--bg);color:var(--text);font-family:var(--font-data);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* ── Noise & Orbs ── */
.noise{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");background-size:256px;mix-blend-mode:overlay}
.glow-orb{position:fixed;border-radius:50%;filter:blur(130px);pointer-events:none;z-index:0;transition:transform 0.8s cubic-bezier(0.25,0.46,0.45,0.94)}
.glow-orb.a{width:600px;height:600px;top:-250px;left:-150px;background:radial-gradient(circle,rgba(59,130,246,0.14) 0%,rgba(37,99,235,0.06) 60%,transparent 100%)}
.glow-orb.b{width:500px;height:500px;bottom:50px;right:-150px;background:radial-gradient(circle,rgba(45,212,191,0.1) 0%,rgba(20,184,166,0.04) 60%,transparent 100%)}
.glow-orb.c{width:350px;height:350px;top:45%;left:42%;background:radial-gradient(circle,rgba(251,191,36,0.06) 0%,transparent 70%)}
@media(max-width:640px){.glow-orb{filter:blur(60px)}.glow-orb.a{width:300px;height:300px}.glow-orb.b{width:260px;height:260px}.glow-orb.c{width:200px;height:200px}}

/* ── Weather Background ── */
#weather-bg{position:fixed;inset:0;z-index:0;transition:background 1.5s ease;pointer-events:none;will-change:transform}
#weather-bg.bg-sunny{background:linear-gradient(180deg,#0a1628 0%,#0f2240 25%,#1a3a60 55%,#254d7a 80%,#2a5a90 100%)}
#weather-bg.bg-sunny.night{background:linear-gradient(180deg,#020408 0%,#04080f 25%,#060c18 55%,#081020 80%,#0b1428 100%)}
#weather-bg.bg-partly-cloudy{background:linear-gradient(180deg,#0d1e35 0%,#152840 25%,#1c3550 55%,#234468 80%,#2a5280 100%)}
#weather-bg.bg-partly-cloudy.night{background:linear-gradient(180deg,#030610 0%,#060c18 30%,#0a1220 60%,#0e1828 85%,#121e30 100%)}
#weather-bg.bg-overcast{background:linear-gradient(180deg,#0d1520 0%,#121d2e 25%,#182538 55%,#1d2e45 80%,#223550 100%)}
#weather-bg.bg-overcast.night{background:linear-gradient(180deg,#05080e 0%,#080c15 30%,#0b101e 60%,#0e1428 85%,#111830 100%)}
#weather-bg.bg-fog{background:linear-gradient(180deg,#151c28 0%,#1c2535 25%,#232e42 55%,#2a3650 80%,#303e5a 100%)}
#weather-bg.bg-rain{background:linear-gradient(180deg,#060e1a 0%,#0a1628 25%,#0f2035 55%,#142840 80%,#192f50 100%)}
#weather-bg.bg-rain.night{background:linear-gradient(180deg,#020408 0%,#040810 25%,#060c18 55%,#080f20 80%,#0a1228 100%)}
#weather-bg.bg-snow{background:linear-gradient(180deg,#5a7898 0%,#7898b8 25%,#a0b8cc 55%,#c8d8e6 80%,#e0ecf6 100%)}
#weather-bg.bg-snow.night{background:linear-gradient(180deg,#08101e 0%,#101828 30%,#182030 60%,#1e2838 85%,#243040 100%)}
#weather-bg.bg-storm{background:linear-gradient(180deg,#030508 0%,#06080f 30%,#090c18 60%,#0c1020 100%)}
#weather-bg.bg-hail{background:linear-gradient(180deg,#0d1520 0%,#152030 30%,#1a2840 60%,#202f50 100%)}
.sun-bg-orb{position:absolute;top:-100px;left:50%;transform:translateX(-50%);width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,0.15) 0%,rgba(251,191,36,0.05) 40%,transparent 70%);pointer-events:none}
.sun-glow-ring{position:absolute;top:5%;left:50%;transform:translateX(-50%);width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,0.12) 0%,rgba(251,191,36,0.04) 50%,transparent 70%);animation:ray-pulse 4s ease infinite;pointer-events:none}
.sun-bg-rays{position:absolute;top:0;left:0;width:100%;height:60%;background:conic-gradient(from 0deg at 50% 0%,rgba(251,191,36,0.03) 0deg,transparent 20deg,rgba(251,191,36,0.03) 40deg,transparent 60deg,rgba(251,191,36,0.03) 80deg,transparent 100deg,rgba(251,191,36,0.03) 120deg,transparent 140deg,rgba(251,191,36,0.03) 160deg,transparent 180deg,rgba(251,191,36,0.03) 200deg,transparent 220deg,rgba(251,191,36,0.03) 240deg,transparent 260deg,rgba(251,191,36,0.03) 280deg,transparent 300deg,rgba(251,191,36,0.03) 320deg,transparent 340deg,rgba(251,191,36,0.03) 360deg);pointer-events:none}
.cloud-shape{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,0.06);filter:blur(25px);animation:cloud-drift ease-in-out infinite}
.rain-container{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.rain-drop{position:absolute;top:-10%;width:1.5px;background:linear-gradient(180deg,transparent 0%,rgba(147,197,253,0.6) 50%,rgba(167,210,255,0.4) 100%);border-radius:1px;animation:rain-fall linear infinite}
.rain-drop.night-drop{background:linear-gradient(180deg,transparent 0%,rgba(180,200,255,0.4) 50%,rgba(200,215,255,0.3) 100%)}
.rain-splash{position:absolute;bottom:0;width:100%;height:6px;background:linear-gradient(180deg,rgba(100,160,255,0) 0%,rgba(100,160,255,0.05) 100%);animation:splash-pulse 1.5s ease-in-out infinite}
.pavement-reflection{position:absolute;bottom:0;left:0;right:0;height:20%;background:linear-gradient(180deg,transparent,rgba(80,120,200,0.07));animation:reflection-shimmer 3s ease-in-out infinite}
.snow-container{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.snow-flake{position:absolute;top:-5%;border-radius:50%;background:rgba(255,255,255,0.9);animation:snow-fall linear infinite;filter:blur(0.3px);box-shadow:0 0 3px rgba(255,255,255,0.6)}
.snow-flake.night-flake{background:rgba(200,220,255,0.85);box-shadow:0 0 5px rgba(180,210,255,0.7)}
.fog-layer{position:absolute;width:100%;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(200,210,230,0.06),rgba(210,220,240,0.08),rgba(200,210,230,0.05),transparent);border-radius:40px;filter:blur(12px);animation:fog-drift ease-in-out infinite}
.stars-container{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.star{position:absolute;background:white;border-radius:50%;animation:star-twinkle ease infinite}
.moon-glow{position:absolute;top:8%;right:15%;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(200,220,255,0.12) 0%,transparent 70%);animation:moon-glow 4s ease infinite;pointer-events:none}
.lightning-flash{position:absolute;inset:0;opacity:0;animation:lightning-strike 11s ease infinite;pointer-events:none}
.storm-clouds{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.storm-cloud{position:absolute;top:-20%;border-radius:50%;background:rgba(255,255,255,0.03);filter:blur(30px);animation:cloud-drift ease-in-out infinite}
.hail-container{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.hail-drop{position:absolute;top:-10%;border-radius:50%;background:rgba(200,220,255,0.8);box-shadow:0 0 3px rgba(200,220,255,0.5);animation:rain-fall linear infinite}
.winter-aurora{position:absolute;width:100%;height:50%;top:0;background:linear-gradient(180deg,rgba(60,100,200,0.06) 0%,rgba(80,160,220,0.04) 40%,transparent 100%);filter:blur(18px);animation:aurora-wave 20s ease-in-out infinite;pointer-events:none}

/* ── Animations ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes ray-pulse{0%,100%{opacity:0.7;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
@keyframes cloud-drift{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
@keyframes rain-drip{0%{transform:translateY(-4px);opacity:0}30%{opacity:1}100%{transform:translateY(12px);opacity:0}}
@keyframes snow-spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes bolt-flash{0%,90%,100%{opacity:0}92%{opacity:1}94%{opacity:0.5}96%{opacity:0.9}98%{opacity:0}}
@keyframes fog-drift{0%,100%{transform:translateX(0);opacity:0.6}50%{transform:translateX(5px);opacity:1}}
@keyframes moon-glow{0%,100%{filter:drop-shadow(0 0 4px rgba(148,163,184,0.6))}50%{filter:drop-shadow(0 0 10px rgba(148,163,184,0.9))}}
@keyframes sun-rotate{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes rain-fall{0%{top:-10%;opacity:0}5%{opacity:0.8}92%{opacity:0.5}100%{top:110%;transform:translateX(-18px);opacity:0}}
@keyframes star-twinkle{0%,100%{opacity:0.2;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
@keyframes lightning-strike{0%,82%,100%{opacity:0;background:rgba(180,210,255,0)}83%{opacity:1;background:rgba(200,230,255,0.2)}84%{opacity:0}85%{opacity:0.7;background:rgba(210,230,255,0.14)}86%,89%{opacity:0}90%{opacity:0.4;background:rgba(180,210,255,0.07)}91%{opacity:0}}
@keyframes snow-fall{0%{top:-5%;transform:translateX(0) rotate(0deg) scale(1);opacity:0}8%{opacity:1}90%{opacity:0.8}100%{top:110%;transform:translateX(var(--sx,40px)) rotate(720deg) scale(0.8);opacity:0}}
@keyframes aurora-wave{0%,100%{opacity:0.4;transform:skewX(0deg)}33%{opacity:0.9;transform:skewX(3deg)}66%{opacity:0.6;transform:skewX(-2deg)}}
@keyframes splash-pulse{0%,100%{opacity:0.3}50%{opacity:0.8}}
@keyframes reflection-shimmer{0%,100%{opacity:0.3}50%{opacity:0.8}}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.8)}}
@keyframes count-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes alert-slide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes badge-pop{0%{transform:scale(0.8);opacity:0}100%{transform:scale(1);opacity:1}}

/* ── App Layout ── */
.app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:48px 28px 90px}
@media(max-width:600px){.app{padding:20px 14px 60px}}

/* ── Search ── */
.search-wrap{position:relative;margin-bottom:36px;animation:fadeUp 0.5s ease both;isolation:isolate;z-index:200}
.search-inner{position:relative;display:flex;align-items:center}
.top-bar{position:absolute;top:-42px;right:0;display:flex;gap:6px;align-items:center}
.top-bar-label{font-size:11px;color:var(--text3);letter-spacing:0.5px;margin-right:4px}
.search-icon{position:absolute;left:18px;color:var(--text3);pointer-events:none;z-index:1;display:flex;align-items:center}
.search-input{width:100%;padding:15px 130px 15px 50px;background:rgba(255,255,255,0.05);backdrop-filter:blur(var(--blur-sm));-webkit-backdrop-filter:blur(var(--blur-sm));border:1px solid var(--border2);border-radius:var(--r3);color:var(--text);font-size:15px;font-family:var(--font-data);font-weight:400;letter-spacing:0.2px;outline:none;transition:border-color 0.2s,background 0.2s,box-shadow 0.2s;box-shadow:var(--inner-glow),var(--shadow-sm)}
.search-input::placeholder{color:var(--text3)}
.search-input:focus{border-color:var(--border-glow);background:rgba(255,255,255,0.07);box-shadow:var(--inner-glow),0 0 0 3px rgba(99,160,255,0.1),var(--shadow-sm)}
.search-clear{position:absolute;right:110px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;padding:6px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:color 0.15s,background 0.15s}
.search-clear:hover{color:var(--text);background:rgba(255,255,255,0.08)}
.gps-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:6px;padding:8px 14px;background:rgba(45,212,191,0.1);border:1px solid rgba(45,212,191,0.3);border-radius:18px;color:var(--teal);font-family:var(--font-data);font-size:12px;font-weight:500;cursor:pointer;transition:background 0.18s,border-color 0.18s,transform 0.15s;white-space:nowrap;letter-spacing:0.3px}
.gps-btn:hover{background:rgba(45,212,191,0.18);border-color:rgba(45,212,191,0.5);transform:translateY(-50%) scale(1.04)}
.gps-btn.loading{opacity:0.7;pointer-events:none}
.gps-btn .gps-icon{display:flex;align-items:center;line-height:1;transition:transform 0.4s}
.gps-btn.loading .gps-icon{animation:spin 0.8s linear infinite}
.icon-btn{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;color:var(--text2);cursor:pointer;padding:7px 10px;font-size:13px;transition:all 0.18s;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.icon-btn:hover{background:rgba(255,255,255,0.1);border-color:var(--border2);color:var(--text)}
.icon-btn.active{background:rgba(96,165,250,0.1);border-color:rgba(96,165,250,0.3);color:var(--blue)}
.unit-badge{display:inline-flex;align-items:center;gap:2px;font-family:var(--font-mono);font-size:11px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.unit-opt{padding:4px 8px;cursor:pointer;color:var(--text3);transition:all 0.15s}
.unit-opt.on{background:rgba(96,165,250,0.15);color:var(--blue)}
.search-suggestions{position:absolute;top:calc(100% + 10px);left:0;right:0;background:rgba(6,9,26,0.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(99,160,255,0.25);border-radius:var(--r2);overflow:hidden;z-index:9999;box-shadow:0 20px 50px rgba(0,0,0,0.9),0 5px 15px rgba(0,0,0,0.5);display:none;animation:fadeUp 0.2s ease-out both}
.search-suggestions.open{display:contents}
.suggestion-item{padding:12px 18px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background 0.12s;position:relative}
.suggestion-item+.suggestion-item::before{content:'';position:absolute;top:0;left:18px;right:18px;height:1px;background:rgba(255,255,255,0.05)}
.suggestion-item:hover,.suggestion-item.focused{background:rgba(96,165,250,0.12)}
.suggestion-pin-wrap{width:34px;height:34px;border-radius:10px;flex-shrink:0;background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;transition:background 0.12s}
.suggestion-item:hover .suggestion-pin-wrap,.suggestion-item.focused .suggestion-pin-wrap{background:rgba(96,165,250,0.2)}
.suggestion-pin{color:var(--text3);display:flex}
.suggestion-item:hover .suggestion-pin,.suggestion-item.focused .suggestion-pin{color:var(--blue)}
.suggestion-text{flex:1;min-width:0}
.suggestion-name{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.suggestion-region{font-size:11px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.suggestion-meta{font-size:11px;color:rgba(96,165,250,0.7);background:rgba(96,165,250,0.08);border:1px solid rgba(96,165,250,0.15);border-radius:20px;padding:2px 9px;flex-shrink:0;white-space:nowrap;font-family:var(--font-mono)}
.search-loading{padding:16px 20px;color:var(--text3);font-size:13px;display:flex;align-items:center;gap:10px}
.mini-spin{width:14px;height:14px;border:1.5px solid rgba(96,165,250,0.2);border-top-color:var(--blue);border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0}
.search-no-results{padding:16px 20px;color:var(--text3);font-size:13px;display:flex;align-items:center;gap:10px}
.favorites-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:20px}
.fav-chip{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:20px;color:var(--text2);font-size:12px;padding:5px 12px;cursor:pointer;font-family:var(--font-data);transition:all 0.15s;display:inline-flex;align-items:center;gap:6px}
.fav-chip:hover{background:rgba(96,165,250,0.1);border-color:rgba(96,165,250,0.3);color:var(--text)}
.fav-chip.active{background:rgba(96,165,250,0.15);border-color:rgba(96,165,250,0.4);color:var(--blue)}
.fav-chip .rm{color:var(--text3);font-size:14px;cursor:pointer;transition:color 0.15s}
.fav-chip .rm:hover{color:var(--danger)}
.fav-star{background:none;border:none;cursor:pointer;font-size:22px;color:var(--text3);transition:color 0.2s,transform 0.2s;padding:2px 4px;line-height:1}
.fav-star:hover{color:var(--gold);transform:scale(1.2)}
.fav-star.saved{color:var(--gold);text-shadow:0 0 12px rgba(251,191,36,0.5)}
@media(max-width:400px){.gps-btn span.gps-label{display:none}.search-input{padding-right:60px}.search-clear{right:54px}}

/* ── Alert Banner ── */
.alerts-section{margin-bottom:20px}
.alert-item{display:flex;align-items:flex-start;gap:12px;border-radius:14px;padding:12px 16px;font-size:13px;line-height:1.5;letter-spacing:0.2px;animation:alert-slide 0.3s ease both;margin-bottom:8px;position:relative;overflow:hidden}
.alert-item::before{content:'';position:absolute;inset:0;background:inherit;filter:blur(0);opacity:0.08}
.alert-item.danger{background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.25);color:rgba(248,113,113,0.95)}
.alert-item.warn{background:rgba(251,146,60,0.08);border:1px solid rgba(251,146,60,0.25);color:rgba(251,146,60,0.95)}
.alert-item.info{background:rgba(96,165,250,0.08);border:1px solid rgba(96,165,250,0.22);color:rgba(147,197,253,0.9)}
.alert-item.success{background:rgba(74,222,128,0.07);border:1px solid rgba(74,222,128,0.22);color:rgba(74,222,128,0.9)}
.alert-icon{font-size:18px;flex-shrink:0;line-height:1.3}
.alert-body{flex:1}
.alert-title{font-weight:600;margin-bottom:2px}
.alert-desc{font-size:12px;opacity:0.8;margin-top:1px}
.alert-close{background:none;border:none;color:inherit;opacity:0.5;cursor:pointer;font-size:16px;padding:0 2px;flex-shrink:0;transition:opacity 0.15s;line-height:1;align-self:flex-start}
.alert-close:hover{opacity:1}

/* ── Header ── */
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:40px;animation:fadeUp 0.6s ease both}
.location-head{display:flex;align-items:center;gap:10px}
.location-name{font-family:var(--font-display);font-size:54px;font-weight:700;letter-spacing:-2px;line-height:1;color:var(--text);text-shadow:0 2px 20px rgba(96,165,250,0.15)}
.location-sub{font-size:12px;color:var(--text2);margin-top:8px;font-weight:400;letter-spacing:2.5px;text-transform:uppercase;opacity:0.7}
.now-temp{text-align:right}
.current-temp{font-family:var(--font-display);font-size:88px;font-weight:700;line-height:1;letter-spacing:-4px;background:linear-gradient(135deg,#eef0ff 30%,var(--gold) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 30px rgba(251,191,36,0.2))}
.current-icon{text-align:right;margin-bottom:4px}

/* ── Metrics Grid ── */

.metric-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:10px;font-weight:500;display:flex;align-items:center;gap:6px}
.metric-label svg{opacity:0.5}
.metric-value{font-family:var(--font-display);font-size:32px;font-weight:700;color:var(--text);line-height:1;letter-spacing:-1px}
.metric-value span{font-size:14px;color:var(--text3);font-weight:400;letter-spacing:0;margin-left:2px}
.metric-sub{font-size:11px;color:var(--text2);margin-top:6px}
.metric-bar{height:3px;background:rgba(255,255,255,0.07);border-radius:2px;margin-top:10px;overflow:hidden}
.metric-bar-fill{height:100%;border-radius:2px;transition:width 1s ease}
.metric-trend{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 6px;border-radius:10px;margin-top:6px;font-family:var(--font-mono)}
.metric-trend.up{background:rgba(74,222,128,0.1);color:var(--success)}
.metric-trend.down{background:rgba(248,113,113,0.1);color:var(--danger)}
.metric-trend.stable{background:rgba(255,255,255,0.06);color:var(--text3)}

/* ── Outfit Card ── */
.outfit-card{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:18px 22px;margin-bottom:24px;animation:fadeUp 0.6s 0.1s ease both;box-shadow:var(--shadow-sm),var(--inner-glow)}
.outfit-emoji{font-size:36px;width:56px;height:56px;flex-shrink:0;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:var(--inner-glow)}
.outfit-title{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.outfit-text{font-size:14px;color:var(--text2);line-height:1.5}
.outfit-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}

/* ── Section Label ── */
.section-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--text3);margin-bottom:14px;margin-top:4px;font-weight:500}

/* ── Best Window ── */
.best-window{background:rgba(45,212,191,0.07);border:1px solid rgba(45,212,191,0.2);border-radius:12px;padding:11px 16px;margin-bottom:14px;font-size:13px;color:rgba(45,212,191,0.9);line-height:1.5}

/* ── Hourly Strip ── */
.hourly-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:24px;scroll-snap-type:x mandatory;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.08) transparent}
.hourly-scroll::-webkit-scrollbar{height:4px}

.hour-card{flex-shrink:0;scroll-snap-align:start;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:12px 14px;text-align:center;cursor:pointer;min-width:68px;transition:background 0.18s,border-color 0.18s,transform 0.15s;box-shadow:var(--shadow-sm)}

.hour-temp{font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--text)}
.hour-feel{font-size:10px;color:var(--text3);margin-top:2px}
.hour-prec{font-size:10px;color:var(--rain);margin-top:2px;min-height:14px}
.hour-day-sep{flex-shrink:0;align-self:center;color:var(--text3);font-size:16px;padding:0 4px;opacity:0.5}

/* ── Week Summary ── */
.week-summary-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:20px 22px;margin-bottom:24px;animation:fadeUp 0.6s 0.15s ease both;box-shadow:var(--shadow-sm),var(--inner-glow)}
.week-summary-title{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--text3);margin-bottom:14px;font-weight:500}

@media(max-width:600px){.week-summary-grid{grid-template-columns:repeat(2,1fr)}}
.week-summary-label{font-size:11px;color:var(--text3);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.wsi-icon{font-size:13px;line-height:1}
.week-summary-value{font-family:var(--font-display);font-size:20px;font-weight:700;line-height:1.1;letter-spacing:-0.5px}
.week-summary-value.hot{color:var(--gold)}
.week-summary-value.cold{color:#93c5fd}
.week-summary-value.rain{color:var(--rain)}
.week-summary-value.chance{color:var(--teal)}
.week-summary-day{font-size:10px;color:var(--text3);margin-top:3px;text-transform:uppercase;letter-spacing:1px}

/* ── 10-Day Grid ── */
.days-grid{display:flex;flex-direction:column;gap:6px;margin-bottom:24px;animation:fadeUp 0.6s 0.18s ease both}
.day-card{display:grid;grid-template-columns:100px 50px 1fr 80px;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:13px 18px;cursor:pointer;transition:background 0.18s,border-color 0.18s,transform 0.15s;box-shadow:var(--shadow-sm)}
.day-card:hover{background:var(--card-hover);border-color:var(--border2);transform:translateX(3px)}
.day-card.active{background:rgba(96,165,250,0.1);border-color:rgba(96,165,250,0.3)}
.day-name{font-size:14px;font-weight:600;color:var(--text);display:block}
.day-date{font-size:11px;color:var(--text3);font-family:var(--font-mono)}
.day-icon{font-size:26px;line-height:1;display:flex}
.day-desc{font-size:12px;color:var(--text2)}
.day-prec{font-size:12px;color:var(--rain)}
.day-prec.no-rain{color:transparent}
.day-temps{text-align:right}
.day-low{font-family:var(--font-display);font-size:16px;font-weight:400;color:var(--text2)}
.day-high{font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--text);margin-left:6px}
@media(max-width:600px){.day-card{grid-template-columns:80px 40px 1fr 70px;gap:8px;padding:11px 14px}.day-name{font-size:13px}}

/* ── Precip Total ── */
.precip-total-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;background:rgba(96,165,250,0.05);border:1px solid rgba(96,165,250,0.18);border-radius:var(--r2);padding:20px 22px;margin-bottom:24px;animation:fadeUp 0.6s 0.2s ease both;box-shadow:var(--shadow-sm),var(--inner-glow)}
.precip-total-icon{font-size:32px;width:52px;height:52px;background:rgba(96,165,250,0.08);border:1px solid rgba(96,165,250,0.18);border-radius:14px;display:flex;align-items:center;justify-content:center}
.precip-total-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.precip-total-value{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--text);line-height:1}
.precip-total-value span{font-size:14px;color:var(--text3);font-weight:400;margin-left:2px}
.precip-total-sub{font-size:12px;color:var(--text2);margin-top:4px}
.precip-rainy-days{font-size:13px;color:var(--text2);margin-bottom:8px}
.precip-rainy-days strong{color:var(--text)}
.precip-bar-wrap{height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;margin-bottom:5px}
.precip-bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:2px;transition:width 1.2s ease}
.precip-bar-label{font-size:10px;color:var(--text3)}

/* ── Air Quality Card ── */
.aqi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:20px 22px;margin-bottom:24px;animation:fadeUp 0.6s 0.21s ease both;box-shadow:var(--shadow-sm),var(--inner-glow)}
.aqi-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.aqi-index{display:flex;align-items:center;gap:12px}
.aqi-circle{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;border:2px solid;box-shadow:0 0 20px}
.aqi-val{font-family:var(--font-display);font-size:20px;font-weight:700;line-height:1}
.aqi-lbl-sm{font-size:8px;letter-spacing:1px;text-transform:uppercase;opacity:0.7}
.aqi-info{}
.aqi-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.aqi-status{font-size:16px;font-weight:600;margin-bottom:2px}
.aqi-desc-text{font-size:12px;color:var(--text2)}
.aqi-pollutants{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
@media(max-width:500px){.aqi-pollutants{grid-template-columns:repeat(2,1fr)}}
.aqi-poll-item{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:10px 12px}
.aqi-poll-name{font-size:9px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
.aqi-poll-val{font-family:var(--font-mono);font-size:15px;font-weight:500;color:var(--text)}
.aqi-poll-unit{font-size:9px;color:var(--text3);margin-left:2px}
.aqi-bar-row{margin-top:14px}
.aqi-scale{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-bottom:4px}
.aqi-scale-seg{flex:1;transition:opacity 0.3s}
.aqi-scale-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--text3);letter-spacing:0.5px}
.aqi-pointer-wrap{position:relative;height:12px;margin-top:-2px;margin-bottom:2px}
.aqi-pointer{position:absolute;width:2px;height:12px;background:white;border-radius:1px;transform:translateX(-50%);transition:left 0.8s ease}
.aqi-pointer::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:6px;height:6px;background:white;border-radius:50%}

/* ── Charts ── */
.hourly-chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:22px 22px 16px;margin-bottom:24px;animation:fadeUp 0.6s 0.25s ease both;box-shadow:var(--shadow-sm),var(--inner-glow)}
.hourly-chart-wrap{position:relative;width:100%;height:160px}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;animation:fadeUp 0.6s 0.27s ease both}
@media(max-width:700px){.charts-row{grid-template-columns:1fr}}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:20px 18px 14px;box-shadow:var(--shadow-sm),var(--inner-glow)}
.chart-title,.hourly-chart-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:14px;font-weight:500}
.chart-wrap{position:relative;width:100%;height:180px}

/* ── Wind Chart ── */
.wind-chart-card{background:linear-gradient(135deg,rgba(45,212,191,0.07) 0%,rgba(20,184,166,0.03) 100%);border:1px solid rgba(45,212,191,0.2);border-radius:var(--r2);box-shadow:var(--shadow-sm),var(--inner-glow);padding:22px 22px 16px;margin-bottom:24px;animation:fadeUp 0.6s 0.3s ease both;position:relative;overflow:hidden}
.wind-chart-card::before{content:'';position:absolute;top:-50px;right:-50px;width:220px;height:220px;background:radial-gradient(circle,rgba(45,212,191,0.08) 0%,transparent 70%);pointer-events:none}
.wind-chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.wind-chart-subtitle{font-size:10px;color:var(--text3);letter-spacing:0.5px;margin-top:3px}
.wind-now-badge{display:flex;align-items:center;gap:12px;background:rgba(45,212,191,0.08);border:1px solid rgba(45,212,191,0.22);border-radius:14px;padding:10px 16px}
.wind-compass{font-size:24px;color:var(--teal);transition:transform 0.5s ease;line-height:1;width:28px;text-align:center}
.wind-now-val{font-family:var(--font-mono);font-size:24px;font-weight:400;color:var(--teal);line-height:1}
.wind-now-val span{font-size:12px;color:rgba(45,212,191,0.6);margin-left:3px}
.wind-now-dir{font-size:10px;color:var(--text3);margin-top:2px;letter-spacing:1.5px;text-transform:uppercase}
.wind-chart-wrap{position:relative;width:100%;height:180px}

/* ── Sun Arc ── */
.sun-section{background:linear-gradient(135deg,rgba(251,191,36,0.07) 0%,rgba(245,158,11,0.03) 100%);border:1px solid rgba(251,191,36,0.2);border-radius:var(--r2);box-shadow:var(--shadow-sm),var(--inner-glow);padding:28px 32px;margin-bottom:24px;animation:fadeUp 0.6s 0.32s ease both;display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;position:relative;overflow:hidden}
.sun-section::before{content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:300px;height:200px;background:radial-gradient(circle,rgba(251,191,36,0.08) 0%,transparent 70%);pointer-events:none}
.sun-info{display:flex;flex-direction:column}
.sun-label{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.sun-time{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--gold);letter-spacing:-0.5px;line-height:1}
.sun-duration{font-size:11px;color:var(--text3);margin-top:6px;letter-spacing:1px}
.sun-arc-wrap{display:flex;justify-content:center}
.arc-svg .arc-path{filter:drop-shadow(0 0 6px rgba(251,191,36,0.35))}
.arc-svg .arc-track{opacity:0.12}
.sun-icon-svg{filter:drop-shadow(0 0 10px rgba(251,191,36,0.8))}

/* ── Moon Phase ── */
.moon-phase-card{background:linear-gradient(135deg,rgba(148,163,184,0.06) 0%,rgba(100,116,139,0.03) 100%);border:1px solid rgba(148,163,184,0.18);border-radius:var(--r2);padding:20px 22px;margin-bottom:24px;animation:fadeUp 0.6s 0.33s ease both;box-shadow:var(--shadow-sm),var(--inner-glow);display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.moon-visual{display:flex;flex-direction:column;align-items:center;gap:6px}
.moon-svg-wrap{position:relative;width:60px;height:60px;animation:moon-glow 4s ease infinite}
.moon-details{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.moon-detail-item{}
.moon-detail-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:3px}
.moon-detail-val{font-size:16px;font-weight:600;color:var(--text);font-family:var(--font-display)}
.moon-detail-sub{font-size:10px;color:var(--text3)}
.moon-phase-name{font-size:11px;color:rgba(148,163,184,0.8);letter-spacing:1px;text-align:center}

/* ── Radar / Windy ── */
.windy-section{margin-bottom:24px;animation:fadeUp 0.6s 0.35s ease both}
.windy-card{background:var(--card);border:1px solid var(--border);backdrop-filter:blur(var(--blur-lg)) saturate(1.2);-webkit-backdrop-filter:blur(var(--blur-lg)) saturate(1.2);border-radius:var(--r2);box-shadow:var(--shadow),var(--inner-glow);overflow:hidden;position:relative}
.windy-card-header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--border)}
.windy-card-title{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--text3);display:flex;align-items:center;gap:10px}
.windy-dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal);animation:pulse-dot 2s ease infinite}
.windy-frame-wrap{position:relative;width:100%;height:480px}
.windy-frame-wrap iframe{width:100%;height:100%;border:none;display:block;border-radius:0 0 var(--r2) var(--r2)}
.windy-loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg2);gap:16px;border-radius:0 0 var(--r2) var(--r2);transition:opacity 0.4s;pointer-events:none}
.windy-loader.hidden{opacity:0}
.windy-loader-text{font-size:12px;color:var(--text2);letter-spacing:2px;text-transform:uppercase}

/* ── Loading / Error ── */
.loading{display:flex;align-items:center;justify-content:center;height:300px;flex-direction:column;gap:18px}
.spinner{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite}
.loading-text{font-size:12px;color:var(--text2);letter-spacing:2px;text-transform:uppercase}
.error-msg{color:var(--danger);font-size:14px;padding:24px;text-align:center}

/* ── Light Mode ── */
body.light{--bg:#e8ecf6;--bg2:#dde3f0;--bg3:#d0d8ec;--card:rgba(255,255,255,0.7);--card-hover:rgba(255,255,255,0.85);--border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);--text:#111827;--text2:rgba(17,24,39,0.65);--text3:rgba(17,24,39,0.38)}
body.light #weather-bg{opacity:0.4!important}

/* ── Card Base ── */
.card-glass{background:var(--card);backdrop-filter:blur(var(--blur-lg)) saturate(1.4);-webkit-backdrop-filter:blur(var(--blur-lg)) saturate(1.4);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--shadow),var(--inner-glow);position:relative;overflow:hidden}
.card-glass::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.12) 50%,transparent 100%)}

/* ── Nowcast Detail ── */
.nowcast-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px;animation:fadeUp 0.6s 0.12s ease both}
@media(max-width:500px){.nowcast-grid{grid-template-columns:1fr}}
.nowcast-item{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.nowcast-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.nowcast-texts{}
.nowcast-label{font-size:10px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px}
.nowcast-value{font-size:16px;font-weight:600;color:var(--text);font-family:var(--font-display)}
.nowcast-extra{font-size:11px;color:var(--text3);margin-top:1px}

/* ── Responsive ── */
@media(prefers-reduced-motion:reduce){.noise{display:none}.glow-orb{filter:blur(50px)}}
</style>

// ─── State ───
const state = {
  lat:44.4268, lon:26.1025, tz:'Europe/Bucharest',
  city:'București', country:'Romania',
  data:null, selectedDay:0, selectedHour:null, unit:'C'
};

function setState(p){ Object.assign(state,p); }

let precipChart=null, tempChart=null, hourlyChart=null, windChart=null;
let searchTimeout=null, focusedSuggestion=-1, clockInterval=null;

// ─── Utilities ───
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function ft(v){ return state.unit==='F'?Math.round(v*9/5+32):Math.round(v); }
function ftLabel(){ return state.unit==='F'?'°F':'°C'; }

function nowLocalISO(){
  const now=new Date();
  const tz=state.tz||'UTC';
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(now);
  const get=t=>parts.find(p=>p.type===t)?.value??'00';
  const dateStr=`${get('year')}-${get('month')}-${get('day')}`;
  const hourStr=get('hour')==='24'?'00':get('hour');
  return{now,dateStr,hourStr,currentHourStr:`${dateStr}T${hourStr}`};
}

function setUnit(u){
  state.unit=u;
  document.getElementById('unitC').classList.toggle('on',u==='C');
  document.getElementById('unitF').classList.toggle('on',u==='F');
  if(state.data) render(state.data);
}

function cycleTheme(){
  document.body.classList.toggle('light');
}

async function shareWeather(){
  const txt=`Vremea în ${state.city}: ${state.data?ft(state.data.current.temperature_2m)+ftLabel():'...'} — MeteoRo`;
  if(navigator.share){
    try{ await navigator.share({title:'MeteoRo',text:txt,url:location.href}); return; }catch(e){}
  }
  try{ await navigator.clipboard.writeText(txt); showToast('✓ Copiat în clipboard!'); }catch(e){ showToast('Partajare indisponibilă'); }
}

function refreshWeather(){
  const btn=document.getElementById('refreshBtn');
  btn.style.animation='spin 0.6s linear';
  setTimeout(()=>btn.style.animation='',800);
  loadWeather();
}

function showToast(msg){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(10,15,30,0.95);border:1px solid rgba(255,255,255,0.1);color:#eef0ff;font-size:13px;padding:10px 20px;border-radius:20px;z-index:9999;animation:fadeUp 0.3s ease;backdrop-filter:blur(10px)';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}

// ─── Search ───
const searchInput=document.getElementById('searchInput');
const searchClear=document.getElementById('searchClear');
const searchSugg=document.getElementById('searchSuggestions');
const geocodeCache=new Map();

searchInput.addEventListener('input',()=>{
  const q=searchInput.value.trim();
  searchClear.style.display=q?'flex':'none';
  clearTimeout(searchTimeout);
  if(q.length<2){closeSuggestions();return;}
  searchSugg.innerHTML=`<div class="search-loading"><div class="mini-spin"></div> Se caută…</div>`;
  searchSugg.classList.add('open');
  searchTimeout=setTimeout(()=>geocode(q),300);
});

searchInput.addEventListener('keydown',e=>{
  const items=searchSugg.querySelectorAll('.suggestion-item');
  if(e.key==='ArrowDown'){e.preventDefault();focusedSuggestion=Math.min(focusedSuggestion+1,items.length-1);items.forEach((el,i)=>el.classList.toggle('focused',i===focusedSuggestion));}
  else if(e.key==='ArrowUp'){e.preventDefault();focusedSuggestion=Math.max(focusedSuggestion-1,0);items.forEach((el,i)=>el.classList.toggle('focused',i===focusedSuggestion));}
  else if(e.key==='Enter'){if(focusedSuggestion>=0&&items[focusedSuggestion])items[focusedSuggestion].click();}
  else if(e.key==='Escape'){closeSuggestions();searchInput.blur();}
});

searchClear.addEventListener('click',()=>{searchInput.value='';searchClear.style.display='none';closeSuggestions();searchInput.focus();});
document.addEventListener('click',e=>{if(!document.getElementById('searchWrap').contains(e.target))closeSuggestions();});

function closeSuggestions(){searchSugg.classList.remove('open');searchSugg.innerHTML='';focusedSuggestion=-1;}

async function geocode(q){
  if(geocodeCache.has(q)){renderSuggestions(geocodeCache.get(q));return;}
  try{
    const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=ro&format=json`);
    const data=await r.json();
    const results=data.results||[];
    geocodeCache.set(q,results);
    renderSuggestions(results);
  }catch(e){searchSugg.innerHTML=`<div class="search-no-results">Eroare la căutare.</div>`;}
}

function renderSuggestions(results){
  if(!results.length){searchSugg.innerHTML=`<div class="search-no-results">Nicio locație găsită.</div>`;searchSugg.classList.add('open');return;}
  focusedSuggestion=-1;
  searchSugg.innerHTML=results.map(r=>{
    const region=[r.admin1,r.country].filter(Boolean).join(', ');
    const pop=r.population?`${r.population>=1000000?(r.population/1000000).toFixed(1)+'M':Math.round(r.population/1000)+'k'}`:'';
    return `<div class="suggestion-item" data-lat="${r.latitude}" data-lon="${r.longitude}" data-city="${esc(r.name)}" data-country="${esc(r.country||'')}" data-tz="${r.timezone||'UTC'}">
      <div class="suggestion-pin-wrap"><span class="suggestion-pin">${SVG.pinIcon}</span></div>
      <div class="suggestion-text"><div class="suggestion-name">${esc(r.name)}</div>${region?`<div class="suggestion-region">${esc(region)}</div>`:''}</div>
      ${pop?`<span class="suggestion-meta">${pop}</span>`:''}
    </div>`;
  }).join('');
  searchSugg.classList.add('open');
  searchSugg.querySelectorAll('.suggestion-item').forEach(el=>{
    el.addEventListener('click',()=>{
      setState({lat:parseFloat(el.dataset.lat),lon:parseFloat(el.dataset.lon),city:el.dataset.city,country:el.dataset.country,tz:el.dataset.tz});
      searchInput.value=state.city+(state.country?`, ${state.country}`:'');
      searchClear.style.display='flex';
      closeSuggestions();
      loadWeather();
    });
  });
}

async function useGPSLocation(){
  const btn=document.getElementById('gpsBtn');
  if(!navigator.geolocation){showToast('GPS indisponibil');return;}
  btn.classList.add('loading');
  btn.querySelector('.gps-label').textContent='Se caută…';
  navigator.geolocation.getCurrentPosition(
    async pos=>{
      try{
        const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&localityLanguage=ro`);
        const geo=await r.json();
        setState({lat:pos.coords.latitude,lon:pos.coords.longitude,city:geo.city||geo.locality||'Locația mea',country:geo.countryName||'',tz:Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'});
      }catch{setState({lat:pos.coords.latitude,lon:pos.coords.longitude,city:'Locația mea',country:'',tz:Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'});}
      searchInput.value=state.city;searchClear.style.display='flex';
      btn.classList.remove('loading');btn.querySelector('.gps-label').textContent='Locația mea';
      loadWeather();
    },
    err=>{btn.classList.remove('loading');btn.querySelector('.gps-label').textContent=err.code===1?'Acces refuzat':'Eroare GPS';setTimeout(()=>btn.querySelector('.gps-label').textContent='Locația mea',3000);}
  ,{timeout:10000,enableHighAccuracy:true});
}

// ─── Weather API ───
async function fetchWeather(){
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${state.lat}&longitude=${state.lon}`
    +`&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weathercode,is_day,windspeed_10m,winddirection_10m,windgusts_10m,pressure_msl,uv_index,cloud_cover,dew_point_2m`
    +`&hourly=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weathercode,windspeed_10m,winddirection_10m,windgusts_10m,uv_index,visibility,pressure_msl,cloud_cover,precipitation_probability`
    +`&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,sunrise,sunset,wind_speed_10m_max,uv_index_max`
    +`&timezone=${encodeURIComponent(state.tz)}&forecast_days=10`;
  const r=await fetch(url);
  if(!r.ok)throw new Error(`HTTP ${r.status}`);
  const data=await r.json();
  data._fetchedAt=new Date().toISOString();
  return data;
}

async function fetchAQI(){
  try{
    const url=`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${state.lat}&longitude=${state.lon}`
      +`&current=european_aqi,pm2_5,pm10,nitrogen_dioxide,ozone,sulphur_dioxide`
      +`&timezone=${encodeURIComponent(state.tz)}`;
    const r=await fetch(url);
    if(!r.ok)return null;
    return await r.json();
  }catch{return null;}
}

function loadWeather(){
  document.getElementById('app').innerHTML=`<div class="loading"><div class="spinner"></div><div class="loading-text">Se încarcă datele meteo…</div></div>`;
  Promise.all([fetchWeather(),fetchAQI()])
    .then(([data,aqi])=>render(data,aqi))
    .catch(err=>{document.getElementById('app').innerHTML=`<div class="error-msg">Nu s-au putut încărca datele meteo.<br><small>${err.message}</small></div>`;});
}

// ─── Helpers ───
function formatTime(iso){return iso?iso.slice(11,16):'—';}
function daylight(rise,set){if(!rise||!set)return'';const d=Math.round((new Date(set)-new Date(rise))/60000);return`${Math.floor(d/60)}h ${d%60}m lumină`;}
function windDirLabel(deg){if(deg==null)return'';return['N','NE','E','SE','S','SV','V','NV'][Math.round(deg/45)%8];}
function shortDay(iso){return new Date(iso+'T12:00:00Z').toLocaleDateString('ro-RO',{weekday:'short'});}
function shortDate(iso){return new Date(iso+'T12:00:00Z').toLocaleDateString('ro-RO',{day:'numeric',month:'short'});}

function getHourIsDay(data,t){
  const di=data.daily.time.indexOf(t.slice(0,10));
  if(di<0)return true;
  return t>=data.daily.sunrise[di]&&t<data.daily.sunset[di];
}

function getHourlyFromNow(data,count=24){
  const{currentHourStr,dateStr}=nowLocalISO();
  let ni=data.hourly.time.findIndex(t=>t.startsWith(currentHourStr));
  if(ni<0)ni=0;
  const hours=[];let prevDate=null;
  for(let i=0;i<count;i++){
    const idx=ni+i;if(idx>=data.hourly.time.length)break;
    const t=data.hourly.time[idx];
    const date=t.slice(0,10);
    const isDay=getHourIsDay(data,t);
    hours.push({t,hour:t.slice(11,16),temp:Math.round(data.hourly.temperature_2m[idx]),feel:Math.round(data.hourly.apparent_temperature?.[idx]??data.hourly.temperature_2m[idx]),code:data.hourly.weathercode[idx],prec:+(data.hourly.precipitation?.[idx]??0).toFixed(1),wind:Math.round(data.hourly.windspeed_10m?.[idx]??0),uv:data.hourly.uv_index?.[idx]??0,precProb:data.hourly.precipitation_probability?.[idx]??0,isNow:i===0,isDay,newDay:prevDate!==null&&date!==prevDate});
    prevDate=date;
  }
  return hours;
}

function getHourlyForDay(data,di){
  const target=data.daily.time[di];
  const bi=data.hourly.time.findIndex(t=>t.startsWith(target));
  if(bi<0)return[];
  const hours=[];
  for(let i=0;i<24;i++){
    const idx=bi+i;if(idx>=data.hourly.time.length)break;
    const t=data.hourly.time[idx];if(!t.startsWith(target))break;
    const isDay=getHourIsDay(data,t);
    hours.push({t,hour:t.slice(11,16),temp:Math.round(data.hourly.temperature_2m[idx]),feel:Math.round(data.hourly.apparent_temperature?.[idx]??data.hourly.temperature_2m[idx]),code:data.hourly.weathercode[idx],prec:+(data.hourly.precipitation?.[idx]??0).toFixed(1),wind:Math.round(data.hourly.windspeed_10m?.[idx]??0),uv:data.hourly.uv_index?.[idx]??0,precProb:data.hourly.precipitation_probability?.[idx]??0,isDay});
  }
  return hours;
}

function getRemainingPrecip(data){
  const{dateStr,currentHourStr}=nowLocalISO();
  return data.daily.time.map((day,di)=>{
    const si=data.hourly.time.findIndex(t=>t.startsWith(day));
    if(si<0)return 0;
    let sum=0;
    for(let i=si;i<si+24&&i<data.hourly.time.length;i++){
      if(!data.hourly.time[i].startsWith(day))break;
      if(day===dateStr&&data.hourly.time[i]<currentHourStr)continue;
      sum+=data.hourly.precipitation?.[i]??0;
    }
    return+sum.toFixed(1);
  });
}

function findBestWindow(hours){
  if(!hours||hours.length<3)return null;
  let best=null,bestScore=1e9;
  for(let i=0;i<=hours.length-3;i++){
    const s=hours.slice(i,i+3);
    const prec=s.reduce((a,h)=>a+h.prec,0);
    const wind=s.reduce((a,h)=>a+h.wind,0)/3;
    const temp=s.reduce((a,h)=>a+h.temp,0)/3;
    const score=prec*10+wind*0.5-(temp>=18&&temp<=26?5:0);
    if(score<bestScore){bestScore=score;best={start:s[0].hour,end:s[2].hour,temp:Math.round(temp),prec:prec.toFixed(1)};}
  }
  return best;
}

// ─── Moon Phase ───
function getMoonPhase(date){
  const d=new Date(date);
  const year=d.getFullYear(),month=d.getMonth()+1,day=d.getDate();
  let jd=367*year-Math.floor(7*(year+Math.floor((month+9)/12))/4)+Math.floor(275*month/9)+day+1721013.5;
  const cycle=(jd-2451550.1)/29.530588853;
  const phase=cycle-Math.floor(cycle);
  const pct=Math.round(phase*100);
  let name,emoji;
  if(pct<4)name='Lună nouă',emoji='🌑';
  else if(pct<25)name='Lună în creștere',emoji='🌒';
  else if(pct<30)name='Primul pătrar',emoji='🌓';
  else if(pct<47)name='Gibboasă în creștere',emoji='🌔';
  else if(pct<54)name='Lună plină',emoji='🌕';
  else if(pct<71)name='Gibboasă în descreștere',emoji='🌖';
  else if(pct<75)name='Ultimul pătrar',emoji='🌗';
  else if(pct<96)name='Lună în scădere',emoji='🌘';
  else name='Lună nouă',emoji='🌑';
  return{phase,pct,name,emoji};
}

function buildAlerts(hours,cw,daily,aqiData){
  const alerts=[];
  const ws=cw.windspeed_10m||0,wg=cw.windgusts_10m||0,uv=cw.uv_index||0;
  const temp=cw.temperature_2m,code=cw.weathercode,hum=cw.relative_humidity_2m||0;
  // Wind alerts
  if(ws>70||wg>90){alerts.push({type:'danger',icon:'🌀',title:'Vânt extrem de puternic',desc:`Viteza: ${Math.round(ws)} km/h, rafale: ${Math.round(wg)} km/h. Riscuri majore în exterior.`});}
  else if(ws>45||wg>65){alerts.push({type:'warn',icon:'💨',title:'Vânt puternic',desc:`Viteza: ${Math.round(ws)} km/h, rafale: ${Math.round(wg)} km/h. Atenție la obiecte neancorate.`});}
  else if(ws>30){alerts.push({type:'info',icon:'🌬️',title:'Vânt moderat spre tare',desc:`Rafale până la ${Math.round(wg)} km/h.`});}
  // Temperature alerts
  if(temp<=0){alerts.push({type:'info',icon:'🧊',title:'Temperaturi sub zero',desc:`${ft(temp)}${ftLabel()} — posibil gheață pe căi rutiere. Conduceți cu prudență.`});}
  if(temp>=(state.unit==='F'?100:38)){alerts.push({type:'danger',icon:'🔥',title:'Căldură extremă',desc:`${ft(temp)}${ftLabel()} — risc de insolație. Hidratare și evitarea expunerii la prânz.`});}
  else if(temp>=(state.unit==='F'?95:35)){alerts.push({type:'warn',icon:'☀️',title:'Temperaturi foarte ridicate',desc:`${ft(temp)}${ftLabel()} — consumați lichide și stați la umbră.`});}
  // Frost risk
  const minTonight=daily?.temperature_2m_min?.[0];
  if(minTonight!==undefined&&minTonight<=2&&minTonight>-2){alerts.push({type:'warn',icon:'❄️',title:'Risc de brumă/îngheț',desc:`Temperatura minimă nocturnă: ${ft(minTonight)}${ftLabel()}. Protejați plantele sensibile.`});}
  // UV alerts
  if(uv>=11){alerts.push({type:'danger',icon:'☀️',title:'UV extrem',desc:`Index UV: ${uv.toFixed(1)} — protecție maximă, rămâneți la interior la orele de vârf.`});}
  else if(uv>=8){alerts.push({type:'warn',icon:'🕶️',title:'UV foarte ridicat',desc:`Index UV: ${uv.toFixed(1)} — cremă SPF 50+, ochelari și umbrelă obligatorii.`});}
  else if(uv>=6){alerts.push({type:'info',icon:'🧴',title:'UV ridicat',desc:`Index UV: ${uv.toFixed(1)} — aplicați SPF 30+ și limitați expunerea la 11–16.`});}
  // Storm/rain
  if([95,96,99].includes(code)){alerts.push({type:'danger',icon:'⛈️',title:'Furtună electrică',desc:'Evitați spațiile deschise, copacii și obiectele metalice. Adăpostiți-vă imediat.'});}
  else if([65,82].includes(code)){alerts.push({type:'warn',icon:'🌧️',title:'Precipitații abundente',desc:'Ploaie puternică. Posibile inundații în zone joase și curgeri rapide.'});}
  // Humidity discomfort
  if(hum>=85&&temp>=25){alerts.push({type:'warn',icon:'💧',title:'Umezeală disconfort termic',desc:`${hum}% umiditate la ${ft(temp)}${ftLabel()}. Indicele de disconfort termic este ridicat.`});}
  // Fog visibility
  if([45,48].includes(code)){alerts.push({type:'info',icon:'🌫️',title:'Ceață — vizibilitate redusă',desc:'Conduceți cu farurile aprinse și mențineți distanța față de vehiculul din față.'});}
  // Snow
  if([73,75,77,86].includes(code)){alerts.push({type:'warn',icon:'🌨️',title:'Ninsoare',desc:'Posibile perturbări în trafic. Verificați starea drumurilor înainte de călătorie.'});}
  // AQI
  if(aqiData?.current?.european_aqi>=80){
    const aq=aqiData.current.european_aqi;
    const info=getAQIInfo(aq);
    alerts.push({type:aq>=100?'danger':'warn',icon:'😷',title:`Calitate aer ${info.level}`,desc:`Index AQI european: ${Math.round(aq)}. ${info.desc}`});
  }
  // Rain coming
  const precNext3=hours.slice(0,6).reduce((a,h)=>a+h.prec,0);
  if(precNext3>5&&!alerts.find(a=>a.title.includes('abundente'))){alerts.push({type:'info',icon:'🌂',title:'Precipitații în următoarele ore',desc:`${precNext3.toFixed(1)}mm prognozate în următoarele 6 ore. Ia umbrela cu tine.`});}
  return alerts;
}

// ─── Background ───
const PERF=(()=>{
  const w=window.innerWidth||1024;
  const rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  const lc=(navigator.hardwareConcurrency||8)<=4;
  let scale=1;
  if(w<=400)scale=0.35;else if(w<=640)scale=0.5;else if(w<=900)scale=0.75;
  if(lc)scale*=0.8;
  return{scale,rm,fancy:!rm&&scale>=0.75};
})();
function pc(n){if(PERF.rm)return Math.max(1,Math.round(n*0.15));if(PERF.scale>=1)return n;return Math.max(Math.min(n,3),Math.round(n*PERF.scale));}

function buildRain(count,night){let h='<div class="rain-container">';for(let i=0;i<count;i++){const l=Math.random()*110-5,dur=0.4+Math.random()*0.7,del=Math.random()*3,ht=50+Math.random()*100;h+=`<div class="rain-drop${night?' night-drop':''}" style="left:${l}%;height:${ht}px;animation-duration:${dur}s;animation-delay:-${del}s;opacity:${0.4+Math.random()*0.5}"></div>`;}return h+'<div class="rain-splash"></div></div>';}
function buildSnow(count,night){let h='<div class="snow-container">';for(let i=0;i<count;i++){const l=Math.random()*105,s=2+Math.random()*5,dur=4+Math.random()*8,del=Math.random()*8,sx=(Math.random()-0.5)*80;h+=`<div class="snow-flake${night?' night-flake':''}" style="left:${l}%;width:${s}px;height:${s}px;animation-duration:${dur}s;animation-delay:-${del}s;--sx:${sx}px"></div>`;}if(PERF.fancy&&night)h+='<div class="winter-aurora"></div>';return h+'</div>';}
function buildStars(count){let h='<div class="stars-container">';for(let i=0;i<count;i++){const x=Math.random()*100,y=Math.random()*65,s=0.8+Math.random()*2,dur=2+Math.random()*4,del=Math.random()*4;h+=`<div class="star" style="left:${x}%;top:${y}%;width:${s}px;height:${s}px;animation-duration:${dur}s;animation-delay:-${del}s"></div>`;}return h+'</div>';}
function buildClouds(arr){return arr.map(c=>`<div class="cloud-shape" style="width:${c.w}px;height:${c.h}px;top:${c.top};${c.left?'left:'+c.left:'right:'+c.right};animation-duration:${c.dur}s"></div>`).join('');}
function buildFog(night){let h='';for(let i=0;i<pc(5);i++){const top=10+i*15,dur=5+i*1.5,del=i*0.8;h+=`<div class="fog-layer" style="top:${top}%;height:${12+i*4}px;animation-duration:${dur}s;animation-delay:-${del}s"></div>`;}if(night)h=buildStars(pc(15))+h;return h;}
function buildHail(count){let h='<div class="hail-container">';for(let i=0;i<count;i++){const l=Math.random()*105,s=3+Math.random()*4,dur=0.5+Math.random()*0.6,del=Math.random()*2;h+=`<div class="hail-drop" style="left:${l}%;width:${s}px;height:${s}px;animation-duration:${dur}s;animation-delay:-${del}s"></div>`;}return h+'</div>';}
function buildStorm(night){let h=`<div class="storm-clouds">`;for(let i=0;i<pc(4);i++){const w=200+i*80;h+=`<div class="storm-cloud" style="width:${w}px;height:${w*0.4}px;top:${-w*0.2+i*20}px;left:${i*22-10}%;animation-duration:${18+i*5}s"></div>`;}h+='</div><div class="lightning-flash"></div>';let r='';for(let i=0;i<pc(night?100:80);i++){const l=Math.random()*115-8,dur=0.3+Math.random()*0.5,del=Math.random()*2,ht=80+Math.random()*120;r+=`<div class="rain-drop" style="left:${l}%;height:${ht}px;animation-duration:${dur}s;animation-delay:-${del}s;opacity:${0.3+Math.random()*0.5};width:1px"></div>`;}return h+r;}

function getWeatherBgClass(code){
  if([95,96,99].includes(code))return'bg-storm';
  if([71,73,75,77,85,86].includes(code))return'bg-snow';
  if([51,53,55,61,63,65,80,81,82].includes(code))return'bg-rain';
  if([45,48].includes(code))return'bg-fog';
  if(code===3)return'bg-overcast';
  if(code===2)return'bg-partly-cloudy';
  if(code===0||code===1)return'bg-sunny';
  return'bg-overcast';
}

function updateWeatherBg(code,isDay){
  const bg=document.getElementById('weather-bg');if(!bg)return;
  const cls=getWeatherBgClass(code);
  const nc=!isDay?' night':'';
  if(bg._cur===cls+nc)return;
  bg._cur=cls+nc;
  bg.className=cls+nc;
  let inner='';
  if(cls==='bg-sunny'){inner=isDay?`<div class="sun-bg-orb"></div><div class="sun-glow-ring"></div><div class="sun-bg-rays"></div>`:buildStars(pc(100))+'<div class="moon-glow"></div>';}
  else if(cls==='bg-partly-cloudy'){inner=isDay?buildClouds([{w:200,h:80,top:'5%',left:'15%',dur:18},{w:150,h:60,top:'12%',right:'20%',dur:22},{w:120,h:50,top:'25%',left:'60%',dur:15}])+'<div class="sun-glow-ring" style="opacity:0.4"></div>':buildStars(pc(60))+'<div class="moon-glow"></div>';}
  else if(cls==='bg-overcast'){inner=isDay?buildClouds([{w:300,h:100,top:'0%',left:'-10%',dur:25},{w:250,h:90,top:'8%',left:'35%',dur:20},{w:200,h:80,top:'3%',left:'70%',dur:30}]):(buildStars(pc(20))+buildClouds([{w:350,h:120,top:'0%',left:'-15%',dur:28},{w:280,h:100,top:'6%',left:'40%',dur:22}]));}
  else if(cls==='bg-fog'){inner=buildFog(!isDay);}
  else if(cls==='bg-rain'){inner=buildRain(pc(120),!isDay)+(!isDay?'<div class="pavement-reflection"></div>':'');}
  else if(cls==='bg-snow'){inner=buildSnow(pc(80),!isDay);}
  else if(cls==='bg-storm'){inner=buildStorm(!isDay);}
  else if(cls==='bg-hail'){inner=buildHail(pc(60));}
  bg.innerHTML=inner;
}

// ─── Sun Arc ───
function drawSunArc(riseIso,setIso){
  const W=220,H=90;
  const now=new Date(),rise=new Date(riseIso),set=new Date(setIso);
  const prog=Math.max(0,Math.min(1,(now-rise)/(set-rise)));
  const sx=prog*W,sy=H-Math.sin(Math.PI*prog)*H;
  return`<svg class="arc-svg" width="${W}" height="${H+8}" viewBox="0 0 ${W} ${H+8}">
    <defs>
      <linearGradient id="arcG" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
        <stop offset="${Math.round(prog*100)}%" stop-color="#fbbf24" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.1"/>
      </linearGradient>
      <filter id="sg"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <path d="M 0 ${H} Q ${W/2} 0 ${W} ${H}" fill="none" stroke="rgba(251,191,36,0.1)" stroke-width="2" stroke-dasharray="4 6" class="arc-track"/>
    <path d="M 0 ${H} Q ${W/2} 0 ${W} ${H}" fill="none" stroke="url(#arcG)" stroke-width="2.5" stroke-linecap="round" class="arc-path"/>
    ${prog>0&&prog<1?`<circle cx="${sx}" cy="${sy}" r="8" fill="#fbbf24" filter="url(#sg)" class="sun-icon-svg" style="animation:ray-pulse 3s ease infinite;transform-origin:${sx}px ${sy}px"/>`:``}
    <circle cx="0" cy="${H}" r="4" fill="#f59e0b" opacity="0.5"/>
    <circle cx="${W}" cy="${H}" r="4" fill="#f59e0b" opacity="0.5"/>
  </svg>`;
}

  // Temp range

  // Wind
  destroyChart(windChart);
  const wctx=document.getElementById('windChart');
  if(wctx)windChart=new Chart(wctx,{type:'line',data:{labels:hours.map(h=>h.hour),datasets:[{label:'Vânt',data:hours.map(h=>h.wind),borderColor:'rgba(45,212,191,0.8)',backgroundColor:'rgba(45,212,191,0.06)',pointRadius:0,borderWidth:2,tension:0.4,fill:true},{label:'Actual',data:hours.map(()=>Math.round(cw.windspeed_10m||0)),borderColor:'rgba(251,191,36,0.5)',borderWidth:1.5,borderDash:[4,4],pointRadius:0,tension:0,fill:false}]},options:{...chartOpts,scales:{x:{grid:{color:'rgba(255,255,255,0.03)'},ticks:{color:'rgba(238,240,255,0.3)',font:{family:'JetBrains Mono',size:10},maxTicksLimit:12}},y:{grid:{color:'rgba(255,255,255,0.03)'},ticks:{color:'rgba(45,212,191,0.6)',font:{family:'Inter',size:11},callback:v=>v+' km/h'},beginAtZero:true}}}});
